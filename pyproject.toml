[project]
name = "yolo-detection"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "suryansh-sinha", email = "suryanshsinha01@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "nvidia-modelopt[onnx]>=0.47.0",
    "onnx>=1.21.0",
    "onnxruntime-gpu[cuda,cudnn]>=1.22.0",
    "onnxslim>=0.1.98",
    "tensorrt-cu13>=11.4.0.106",
    "ultralytics>=8.4.194",
    "wandb>=0.31.0",
]

[project.scripts]
yolo-detection = "yolo_detection:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
